version: 2

# A SHA-pinned action gets no security updates on its own — pinning trades a
# supply-chain risk for a staleness one, and this file is the other half of
# that trade. Dependabot understands the `uses: owner/name@<sha> # vX.Y.Z`
# form, opens a pull request when the pinned action moves, and rewrites both
# the SHA and the trailing version comment.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # `action.yml` at the repository root is the action consumers run in their
    # own runners, so its one dependency is the one that matters most here;
    # Dependabot covers it under the same root directory as the workflows.
    commit-message:
      prefix: "chore(actions)"
    labels:
      - dependencies

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
    ignore:
      # TypeScript 7 is the native compiler, and its npm package does not
      # carry the API this project is built on. Measured: its main entry
      # exports two things, `version` and `versionMajorMinor`. `createProgram`,
      # `SymbolFlags`, `isIdentifier` and the rest are absent, and `tsc` fails
      # with 225 errors across thirteen files. What exists lives under
      # `typescript/unstable/*` — named unstable by its authors — with an
      # out-of-process architecture rather than an in-process one. Adopting it
      # is a port against an interface that advertises it will move.
      #
      # Pinned by version rather than by update type, and the distinction is
      # the whole point: an earlier version of this file ignored every major,
      # which silently swallowed TypeScript 6 as well. Six keeps the full
      # compiler API — two thousand exports, `tsc` clean, the suite green, and
      # byte-identical analyzer output on a real range — so blocking it would
      # have hidden its security patches for no reason.
      #
      # Revisit seven when the compiler API leaves `unstable/`.
      - dependency-name: typescript
        versions: [">=7"]
    groups:
      # The test toolchain moves together — vitest, vite, and their shared
      # transitive dependencies — so grouping keeps one reviewable pull
      # request instead of four that must land in the same order.
      test-toolchain:
        patterns:
          - vitest
          - "@vitest/*"
          - vite
          - vite-node
          - esbuild
