name: Publish to npm

# Trusted publishing (OIDC). No token exists anywhere — not in a secret, not
# on a maintainer's disk. npm verifies this workflow's identity directly, so
# there is nothing to leak, rotate, or forget to revoke.
#
# The tag filter is `v*.*.*` and not the `v*` npm's own example uses, on
# purpose. This repository already publishes a `v1` tag — the moving major
# tag that `uses: noahogbi/urtext@v1` resolves — and `v*` matches it. With
# npm's filter, re-pointing the action tag would republish the npm package,
# which is a different artifact with a different version line. Two dots are
# what separate a release version from an interface tag.

on:
  push:
    tags:
      - "v*.*.*"
  # An escape hatch for a publish that failed after its tag was already
  # pushed. Safe to leave open: npm refuses a version it already has, so the
  # worst a stray run can do is fail.
  workflow_dispatch:

permissions:
  id-token: write # OIDC — this is what authenticates the publish
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Node 24 for its npm: trusted publishing needs npm 11.5.1 or later.
      # The version here answers the registry's requirement and is unrelated
      # to the `engines` floor this package supports for consumers.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - run: npm ci

      # A tag says which version it is; package.json decides what actually
      # publishes. When they disagree the tag is a lie, and npm would publish
      # the package.json version under it without complaint.
      - name: Refuse a tag that disagrees with package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          declared="$(node -p "require('./package.json').version")"
          if [ "$tagged" != "$declared" ]; then
            echo "::error::Tag $GITHUB_REF_NAME claims version $tagged, but package.json declares $declared. Nothing published."
            exit 1
          fi
          echo "Tag and package.json agree on $declared."

      # The gates this project runs before every commit, run again before the
      # one action that cannot be undone. A published version is permanent;
      # a red check here costs nothing.
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build

      # `npm stage publish`, not `npm publish`. The trusted publisher on
      # npmjs.com grants this workflow permission to STAGE a release, not to
      # put one live: publishing is the only irreversible step in this
      # pipeline, so a human approves it with 2FA after seeing what was
      # built. A direct publish from here is refused — "OIDC permission
      # denied for this action" — which is the registry enforcing the same
      # rule this repository would.
      #
      # Staging needs npm 11.15.0 or later, above the 11.5.1 that trusted
      # publishing alone requires. The guard below is here because the
      # obvious future edit is lowering node-version to match this package's
      # `engines` floor, which would quietly ship an npm too old and fail
      # with something far less legible than this.
      - name: Refuse an npm too old to stage
        run: |
          need=11.15.0
          have="$(npm --version)"
          if [ "$(printf '%s\n%s\n' "$need" "$have" | sort -V | head -n 1)" != "$need" ]; then
            echo "::error::npm $have cannot stage a publish; 11.15.0 or later is required. Raise node-version."
            exit 1
          fi
          echo "npm $have can stage."

      - run: npm stage publish
