name: Scorecard

# OpenSSF Scorecard runs a fixed set of supply-chain checks against this
# repository and produces a number. The number is NOT published: `publish_results`
# is false, so nothing is sent to the OpenSSF API and no badge claims anything.
# Results land in this repository's Security tab, privately, where they can be
# read and argued with before any decision to publish them is made.
#
# That sequencing is deliberate. A published score is read as a claim about
# whether this action is safe to run, and several of the checks it grades
# hardest — branch protection on a single-maintainer repository, signed
# releases, fuzzing — say nothing about that. Measure first, then decide what,
# if anything, is worth claiming.

on:
  schedule:
    # Weekly, well away from the hour everyone else schedules on.
    - cron: "37 5 * * 1"
  workflow_dispatch:
  push:
    branches: [master]

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Upload the SARIF into this repository's own code scanning, which is
      # where the results are readable.
      security-events: write
      # Needed by the action even when results are not published.
      id-token: write
      contents: read
      actions: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # False on purpose — see the note at the top of this file.
          publish_results: false

      # Kept for the run itself, so the raw findings can be read without the
      # Security tab. Ninety days is the default retention; nothing here is
      # sensitive, since the repository is public.
      - name: Upload the raw results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 90

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@486fec2a3ea2626afcd8c7e9208b4f515078dd7e # codeql-bundle-v2.26.4
        with:
          sarif_file: results.sarif
