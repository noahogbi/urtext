name: Scorecard

# OpenSSF Scorecard runs a fixed set of supply-chain checks against this
# repository and produces a number, now published to the OpenSSF API.
#
# It was not published at first, on purpose: a score is read as a claim about
# whether this action is safe to run, and several of the checks it grades
# hardest say nothing about that. So it ran privately first, its results went
# to this repository's Security tab, and the one check it flagged — branch
# protection — was fixed rather than argued with. A later run flagged nothing.
#
# Publishing it now is therefore reporting a measurement rather than making a
# claim, which is the order this project asks of every other assertion it
# makes about itself. If a future run drops the score, the honest response is
# to fix the finding or to stop publishing — not to leave a badge standing
# that says something the checks no longer support.

on:
  schedule:
    # Weekly, well away from the hour everyone else schedules on.
    - cron: "37 5 * * 1"
  workflow_dispatch:
  push:
    branches: [master]

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Upload the SARIF into this repository's own code scanning, which is
      # where the results are readable.
      security-events: write
      # Needed by the action even when results are not published.
      id-token: write
      contents: read
      actions: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # See the note at the top of this file for why this was false first
          # and is true now.
          publish_results: true

      # Kept for the run itself, so the raw findings can be read without the
      # Security tab. Ninety days is the default retention; nothing here is
      # sensitive, since the repository is public.
      - name: Upload the raw results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 90

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@486fec2a3ea2626afcd8c7e9208b4f515078dd7e # codeql-bundle-v2.26.4
        with:
          sarif_file: results.sarif
