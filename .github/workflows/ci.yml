name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    # Stated rather than inherited. The repository default is read-only today,
    # but that is a setting someone can change in the web UI without touching
    # this file, and a job that only checks out and runs tests should not
    # inherit whatever the default becomes.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The dist smoke test below reviews HEAD~1, so the parent commit
          # must exist locally; a depth-1 clone has no parent to diff against.
          fetch-depth: 2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npm run build
      # The built artifact is what installs ship, so it gets its own run:
      # a green suite proves src/, not dist/. On a pull request HEAD is the
      # merge commit and HEAD~1 the base branch, so this reviews the PR.
      #
      # HEAD~1 does not exist in a repository whose history is a single root
      # commit, which is what this one began as. Falling back to the no-range
      # form rather than skipping: it resolves the working tree against the
      # merge base and still exercises the built binary end to end, so the
      # step keeps proving what it exists to prove instead of quietly
      # proving nothing.
      - name: Smoke-test the built binary
        shell: bash
        run: |
          if git rev-parse --verify --quiet HEAD~1 > /dev/null; then
            node dist/bin.js review HEAD~1 --no-llm
          else
            echo "::notice::HEAD~1 does not exist; smoke-testing against the working tree instead."
            node dist/bin.js review --no-llm
          fi
